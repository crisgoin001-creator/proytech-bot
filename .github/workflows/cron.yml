# Reloj del bot: despierta el servidor y ejecuta recordatorios (cada hora) y resumen diario (8:07 a.m. Lima).
# Requiere el secreto CRON_SECRET en GitHub (Settings > Secrets and variables > Actions) igual al de Render.
name: cron-bot
on:
  schedule:
    - cron: '17 * * * *'     # cada hora: seguimientos
    - cron: '7 13 * * *'     # 13:07 UTC = 8:07 a.m. Lima: resumen diario
  workflow_dispatch: {}
jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Despertar servidor
        run: curl -s -m 90 https://proytech-bot.onrender.com/ || true
      - name: Seguimientos
        if: github.event.schedule != '7 13 * * *'
        run: curl -s -m 120 "https://proytech-bot.onrender.com/cron/seguimientos?key=${{ secrets.CRON_SECRET }}"
      - name: Resumen diario
        if: github.event.schedule == '7 13 * * *'
        run: curl -s -m 120 "https://proytech-bot.onrender.com/cron/resumen?key=${{ secrets.CRON_SECRET }}"
